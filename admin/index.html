<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RLPRODUCTOS - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">RLPRODUCTOS - Admin (prototipo)</h1>

    <section class="mb-6 p-4 bg-white rounded shadow">
      <h2 class="font-semibold mb-2">Configuración</h2>
      <p class="text-sm text-gray-600 mb-2">Token usado sólo para pruebas: guardalo en sessionStorage (no en el código). Recomendado: usar un proxy/server con token.</p>
      <div class="flex gap-2 items-center">
        <input id="gh-token" type="password" class="border p-2 rounded flex-1" placeholder="GITHUB_TOKEN (solo pruebas)" />
        <button id="save-token" class="px-3 py-2 bg-indigo-600 text-white rounded">Guardar</button>
        <span id="save-indicator" class="ml-3 text-sm text-gray-500">No guardado</span>
      </div>
    </section>

    <section class="mb-6 p-4 bg-white rounded shadow">
      <h2 class="font-semibold mb-2">Productos y Categorías</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium">Seleccionar archivo de datos (datos-productos.json)</label>
          <input id="btn-load-data" type="button" value="Cargar datos del repo" class="mt-2 px-3 py-2 bg-green-600 text-white rounded" />
        </div>
        <div>
          <label class="block text-sm font-medium">Agregar / Editar categoría</label>
          <div class="flex gap-2 mt-2">
            <input id="cat-name" class="border p-2 rounded flex-1" placeholder="Nombre de categoría" />
            <button id="add-cat" class="px-3 py-2 bg-indigo-600 text-white rounded">Agregar</button>
          </div>
          <div id="categories" class="mt-3 text-sm text-gray-700"></div>
        </div>
      </div>
    </section>

    <section class="mb-6 p-4 bg-white rounded shadow">
      <h2 class="font-semibold mb-2">Editor de producto</h2>
      <form id="product-form" class="grid grid-cols-1 gap-3">
        <input id="articulo" placeholder="Artículo" class="border p-2 rounded" />
        <div class="grid grid-cols-3 gap-2">
          <input id="codigo" placeholder="Código (se autogenera)" class="border p-2 rounded" />
          <input id="precio_combo" placeholder="Precio combo (ej: 4650)" class="border p-2 rounded" />
          <input id="venta_por_menor" placeholder="Venta por menor (ej: 4700)" class="border p-2 rounded" />
        </div>
        <select id="categoria-select" class="border p-2 rounded"></select>
        <textarea id="descripcion" rows="3" class="border p-2 rounded" placeholder="Descripción"></textarea>
        <div class="flex gap-2 items-center">
          <input id="foto-file" type="file" accept="image/*" />
          <input id="foto-nombre" placeholder="Nombre archivo destino (opcional)" class="border p-2 rounded flex-1" />
        </div>
        <div class="flex gap-2">
          <button id="save-product" class="px-4 py-2 bg-blue-600 text-white rounded">Guardar producto</button>
          <button id="new-product" type="button" class="px-4 py-2 bg-gray-200 rounded">Nuevo</button>
          <div id="product-status" class="ml-auto text-sm text-gray-600"></div>
        </div>
      </form>
    </section>

    <section class="mb-6 p-4 bg-white rounded shadow">
      <h2 class="font-semibold mb-2">Remitos</h2>
      <div class="flex gap-2">
        <label class="flex items-center gap-2"><input id="watermark" type="checkbox" /> Marca de agua</label>
        <label class="flex items-center gap-2"><input id="include-disclaimer" type="checkbox" checked /> Incluir disclaimer mayorista</label>
        <button id="generate-remito" class="px-3 py-2 bg-emerald-600 text-white rounded ml-auto">Generar PDF A4 (original+duplicado)</button>
      </div>
    </section>

    <section class="p-4 bg-white rounded shadow">
      <h2 class="font-semibold mb-2">Logs / Acciones</h2>
      <pre id="log" class="text-xs text-gray-700 p-2 bg-gray-50 rounded max-h-48 overflow-auto"></pre>
    </section>
  </div>

  <script type="module" src="./admin/app.js"></script>
</body>
</html>
